name: Test Backend

on:
  push:
    branches: [main, master]
  pull_request:

permissions: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # Compile-time query checks use the checked-in .sqlx cache. Without this,
      # DATABASE_URL makes sqlx hit the service DB before migrations run, and
      # Clippy / cargo test fail to compile with exit 101.
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Offline compile (sqlx cache)
        working-directory: backend
        run: cargo check --all-targets

      - name: Test
        working-directory: backend
        run: cargo test
