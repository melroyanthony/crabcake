{% extends "layout.html" %}

{% block content %}
<h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.3; color: #18181b;">
  Your account is ready
</h1>
<p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #3f3f46;">
  An account has been created for <strong>{{ email }}</strong>. Sign in below and change your
  password once you are in.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 0 24px;">
  <tr>
    <td style="border-radius: 8px; background-color: #18181b;">
      <a href="{{ login_url }}" style="display: inline-block; padding: 12px 24px; font-size: 15px; font-weight: 600; color: #ffffff; text-decoration: none;">
        Sign in
      </a>
    </td>
  </tr>
</table>
<p style="margin: 0; font-size: 13px; line-height: 1.6; word-break: break-all;">
  <a href="{{ login_url }}" style="color: #2563eb;">{{ login_url }}</a>
</p>
{% endblock %}
