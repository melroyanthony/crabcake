[package]
name = "app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "catch-panic",
    "compression-gzip",
    "cors",
    "limit",
    "request-id",
    "timeout",
    "trace",
] }
sqlx = { version = "0.9", features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls-ring-webpki",
    "uuid",
] }
argon2 = { version = "0.5", features = ["std"] }
# Pulled in explicitly to switch on getrandom, which is what makes SaltString::generate and
# OsRng available through argon2's re-export.
password-hash = { version = "0.5", features = ["getrandom"] }
# jsonwebtoken 11 refuses to pick a crypto backend for you. rust_crypto keeps the build pure
# Rust, with no C toolchain needed for the Docker image.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde"] }
figment = { version = "0.10", features = ["env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
dbg_macro = "warn"
