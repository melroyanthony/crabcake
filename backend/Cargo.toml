[package]
name = "app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

# Writes the OpenAPI document without needing a database or a running server, which is what
# lets the frontend client be regenerated from a checkout alone.
[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

# Drains the job queue. Runs as its own process so that a slow mail server cannot make the
# API slow, and so workers can be scaled separately from it.
[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "catch-panic",
    "compression-gzip",
    "cors",
    "limit",
    "normalize-path",
    "request-id",
    "timeout",
    "trace",
] }
# Held at 0.8 to match apalis-sql, so the whole tree shares one sqlx and one connection pool
# rather than compiling two copies and running two.
sqlx = { version = "0.9", features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls-ring-webpki",
    "uuid",
] }
argon2 = { version = "0.5", features = ["std"] }
# Pulled in explicitly to switch on getrandom, which is what makes SaltString::generate and
# OsRng available through argon2's re-export.
password-hash = { version = "0.6", features = ["getrandom"] }
# jsonwebtoken 11 refuses to pick a crypto backend for you. rust_crypto keeps the build pure
# Rust, with no C toolchain needed for the Docker image.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
base64 = "0.23"
secrecy = { version = "0.10", features = ["serde"] }
# rustls with the ring provider and bundled roots, so the image needs no C toolchain and no
# system certificate store.
lettre = { version = "0.11.22", default-features = false, features = [
    "builder",
    "pool",
    "ring",
    "smtp-transport",
    "tokio1-rustls",
    "webpki-roots",
] }
minijinja = "2"
# Pinned to the stable line rather than the long-running 1.0 release candidate, so that no
# generated project depends on a pre-release.
apalis = { version = "0.7", default-features = false, features = ["retry", "tracing"] }
apalis-sql = { version = "0.7", default-features = false, features = [
    # Creates the queue's own tables on startup, so a fresh database needs no extra step.
    "migrate",
    "postgres",
    "tokio-comp",
] }
# tonic is in its default features and would drag gRPC in for nothing.
tower_governor = { version = "0.8", default-features = false, features = [
    "axum",
    "tracing",
] }
# No default features on any of these, and the HTTP client supplied by hand in `storage`. The
# defaults would bring aws-lc-rs, which needs cmake and a C compiler to build, and their `rustls`
# feature is the old hyper 0.14 path, which would mean a second HTTP stack. Everything else here
# is on ring, so this is too.
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "http-1x",
    "rt-tokio",
] }
aws-credential-types = "1"
aws-smithy-http-client = { version = "1", default-features = false, features = [
    "rustls-ring",
] }
axum-prometheus = "0.10"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# gRPC to a collector on 4317, rather than the HTTP exporter: it is what every collector
# accepts by default, and tonic is already in the tree through the SDK's dependencies.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
tracing-opentelemetry = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.21", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras", "time", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
time = { version = "0.3", features = ["serde"] }
figment = { version = "0.10", features = ["env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
dbg_macro = "warn"

[dev-dependencies]
serde_urlencoded = "0.7.1"
